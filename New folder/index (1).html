<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 PetSkin AI PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">

<style>
:root {
    --main: #00f2ff;
    --grad: linear-gradient(45deg,#00f2ff,#0072ff);
}

body{
    margin:0;
    font-family:'Plus Jakarta Sans';
    background:#020406;
    color:#fff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
    font-family:'Orbitron';
    font-size:3rem;
    background:var(--grad);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.upload{
    border:2px dashed var(--main);
    padding:60px;
    text-align:center;
    border-radius:20px;
    cursor:pointer;
    margin-top:30px;
}

.upload input{display:none;}

.grid{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:25px;
}
.grid img{
    width:100%;
    height:350px;
    object-fit:contain;
    border-radius:15px;
    background:#000;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    font-size:18px;
    background:var(--grad);
    cursor:pointer;
}

.loader{
    display:none;
    margin:20px auto;
    width:40px;
    height:40px;
    border:4px solid #111;
    border-top:4px solid var(--main);
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.result{
    display:none;
    text-align:center;
    margin-top:20px;
}
.bar{
    background:#111;
    height:10px;
    border-radius:10px;
}
.fill{
    height:100%;
    width:0%;
    background:var(--grad);
}
</style>
</head>

<body>

<div class="container">

<h1>PetSkin AI PRO</h1>

<label class="upload" id="zone">
    <h3>📤 Drag & Drop or Click</h3>
    <input type="file" id="file">
</label>

<div class="grid" id="images">
    <img id="orig">
    <img id="heat">
</div>

<button onclick="run()">Analyze 🔍</button>

<div class="loader" id="loader"></div>

<div class="result" id="result">
    <h2 id="disease"></h2>
    <p id="confidence"></p>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>
</div>

</div>

<script>
const fileInput = document.getElementById("file");
const zone = document.getElementById("zone");

zone.addEventListener("dragover", e=>e.preventDefault());
zone.addEventListener("drop", e=>{
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    preview();
});

fileInput.onchange = preview;

function preview(){
    const file = fileInput.files[0];
    if(!file) return;

    document.getElementById("orig").src = URL.createObjectURL(file);
    document.getElementById("images").style.display="grid";
}

async function run(){
    const file = fileInput.files[0];
    if(!file) return alert("Upload image");

    document.getElementById("loader").style.display="block";

    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = async ()=>{
        try{
           const res = await fetch("https://nasrmohammed125-pet-skin-ai.hf.space/run/predict", {
    method:"POST",
    headers:{
        "Content-Type":"application/json"
    },
    body: JSON.stringify({
        data: [reader.result]
    })
});

const json = await res.json();
const data = json.data?.[0];

if(!data){
    throw new Error("Invalid response");
}
            document.getElementById("loader").style.display="none";
            document.getElementById("result").style.display="block";

            document.getElementById("disease").innerText = data.disease;
            document.getElementById("confidence").innerText =
                (data.confidence * 100).toFixed(2) + "%";

            document.getElementById("fill").style.width =
                (data.confidence * 100) + "%";

            document.getElementById("heat").src =
                "data:image/jpeg;base64," + data.heatmap;

        }catch(e){
            console.error(e);
            document.getElementById("loader").style.display="none";
            alert("Server Error ❌");
        }
    }
}
</script>

</body>
</html>
